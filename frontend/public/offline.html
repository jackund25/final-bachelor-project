<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Glucose Monitor - Offline</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;

        font-family:
          Arial,
          Helvetica,
          sans-serif;

        background: #f5f7f9;
        color: #182432;
      }

      .card {
        width: 100%;
        max-width: 520px;

        background: white;
        border: 1px solid #e1e7eb;
        border-radius: 20px;

        padding: 40px;

        text-align: center;

        box-shadow:
          0 10px 30px rgba(20, 40, 60, 0.06);
      }

      .icon {
        width: 64px;
        height: 64px;

        margin: 0 auto 24px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: #edf5f8;
        color: #2f6f8f;

        font-size: 28px;
      }

      .eyebrow {
        margin: 0 0 8px;

        color: #2f6f8f;

        font-size: 12px;
        font-weight: 700;

        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 16px;

        font-size: 28px;
      }

      p {
        margin: 0;

        color: #64748b;

        line-height: 1.6;
      }

      .notice {
        margin-top: 24px;
        padding: 16px;

        border-radius: 12px;

        background: #f8fafb;

        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <div class="icon">⌁</div>

      <p class="eyebrow">
        Clinical Decision Support
      </p>

      <h1>Glucose Monitor</h1>

      <p>
        The application is currently offline.
      </p>

      <div class="notice">
        Clinical assessment and glucose prediction
        require an active connection.
        Please reconnect to continue.
      </div>
    </main>
  </body>
</html>
